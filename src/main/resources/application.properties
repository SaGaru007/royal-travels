spring.application.name=RoyalTravels
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# All secrets come from the environment in production. Local development
# values live in config/application-local.properties (gitignored).
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Supabase's session pooler allows 15 clients. Render runs the old and new
# instance side by side during a deploy, so the default pool of 10 can exhaust
# that limit and fail the new instance's first query. Five leaves headroom.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8081}
server.error.include-message=${ERROR_INCLUDE_MESSAGE:never}
server.error.include-binding-errors=${ERROR_INCLUDE_BINDING_ERRORS:never}

# JSON is verbose; compressing it cuts mobile payloads roughly in half.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

app.jwt.secret=${JWT_SECRET:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
