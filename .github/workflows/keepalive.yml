name: API keep-alive

# Render's free tier sleeps after ~15 idle minutes, turning the next visitor's
# first request into a 30-90 second wait. A ping every 10 minutes keeps the
# instance (and the Supabase project behind it) awake.
#
# Caveats:
#   - GitHub schedules are best-effort and can run several minutes late.
#     cron-job.org is more punctual if you need a hard guarantee.
#   - GitHub disables scheduled workflows in public repositories after 60 days
#     without repository activity. Any push re-enables them.
#
# Never put a token or an admin route in this URL: the target is a public,
# read-only health check that also verifies the database connection.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health endpoint
        run: |
          curl --silent --show-error --fail --max-time 120 \
            https://royal-travels-api.onrender.com/api/health
