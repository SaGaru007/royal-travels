# Render Blueprint — one-click deploy of the RoyalTravels API.
#
#   1. Push this repo to GitHub.
#   2. Render Dashboard → New → Blueprint → select this repository.
#   3. Fill in the prompted secrets (sync: false) when asked.
#
# The Dockerfile at the repository root builds the Spring Boot jar, and the
# health check keeps the free instance from being marked unhealthy while the
# JVM boots.
services:
  - type: web
    name: royal-travels-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
